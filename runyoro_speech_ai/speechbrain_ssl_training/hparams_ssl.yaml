# Seed for reproducibility
seed: 1986
# Training parameters
number_of_epochs: 50  # Adjust as needed
batch_size: 4         # Adjust based on your Mac M4's memory (start very small)
grad_accumulation_factor: 8 # Effective batch size = batch_size * grad_accumulation_factor
lr_adam: 0.00005      # Learning rate for Adam optimizer
lr_wav2vec2: 0.00001  # Specific learning rate for the Wav2Vec2 part if fine-tuning differentially

# Data files
# Assuming the script will be run from speechbrain_ssl_training directory
# and data manifest is in runyoro_speech_ai/data/manifest/
data_folder: ../data/  # Relative path to the main data folder
train_sb_manifest_file: !ref <data_folder>/manifest/sb_ssl_manifest.json # SpeechBrain JSON manifest
# output_folder will be specified in train_sb_ssl.py via command line

# Model parameters
wav2vec2_hub: "facebook/wav2vec2-xls-r-300m" # HuggingFace hub name for the base model
wav2vec2_output_norm: True # Whether to normalize the features from wav2vec2
wav2vec2_freeze_feature_extractor: False # Don't freeze the CNN feature extractor
wav2vec2_freeze_encoder_layers: null # Integer, number of initial transformer layers to freeze. Null or 0 means train all.
                                     # For domain adaptation, training more layers is common. Start with null.

# SSL Objective related (this part is conceptual and needs SpeechBrain expertise for exact implementation)
# This might involve defining a specific SSL objective module or using built-in ones.
# For Wav2Vec2, this would be related to its contrastive loss and feature masking.
# If using a HuBERT-like objective, it would be masked prediction of acoustic clusters.
# This section will likely be more detailed in the Python Brain class.
ssl_objective_type: "hubert_masked_prediction" # Updated placeholder for HuBERT-style

# --- Parameters for HuBERT-style SSL Pre-training ---

# K-means model and target labels (generated by generate_kmeans_targets.py)
kmeans_model_path: !ref <output_folder>/kmeans_model.joblib # Path where K-means model is saved
                                                           # Assumes output_folder is the main experiment output dir
target_label_dir: !ref <output_folder>/kmeans_frame_labels/ # Directory where frame-level K-means labels are saved

num_ssl_clusters: 100  # Number of K-means clusters (should match generate_kmeans_targets.py)
# kmeans_extraction_layer: null # (Optional) Specify if a specific layer from wav2vec2 was used for K-means.
                              # This is more for generate_kmeans_targets.py.

# Masking parameters for HuBERT-style objective (used by SSLBrain in train_sb_ssl.py)
mask_prob: 0.65             # Probability of masking a frame (after feature extraction)
mask_length: 10             # Length of each mask span (in frames)
mask_min_spans: 2           # Minimum number of mask spans per utterance (conceptual, actual masking logic in Brain)

# Prediction Head (on top of Wav2Vec2 encoder, to predict K-means cluster IDs)
ssl_prediction_head: !new:speechbrain.nnet.linear.Linear
    input_size: null # This will be dynamically set from wav2vec2_model.get_enc_out_size() or similar in the Brain
    n_neurons: !ref <num_ssl_clusters> # Output neurons = number of K-means clusters
    bias: True
    # Add other linear layer params if needed, e.g., layer_norm: True

# Optimizer
optimizer: adam
adam_betas: [0.9, 0.98] # Betas for Adam optimizer

# Learning rate scheduler
lr_scheduler: linear_warmup # Example: warmup then linear decay
warmup_steps: 5000 # Number of warmup steps

# Checkpointer - manages saving models
checkpointer:
    save_interval_batches: 1000 # Save a checkpoint every N batches
    keep_last_n_checkpoints: 3  # Keep the last N checkpoints

# Other modules
# Example for a custom data loader if needed, usually handled by Brain class
# train_dataloader_opts:
#   batch_size: !ref <batch_size> # links to global batch_size
#   shuffle: True
#   num_workers: 4 # Based on CPU cores

# Modules dictionary - where we define our main components
# This will be instantiated by the training script.
modules:
    wav2vec2_model: !new:speechbrain.lobes.models.huggingface_wav2vec.HuggingFaceWav2Vec2
        source: !ref <wav2vec2_hub>
        output_norm: !ref <wav2vec2_output_norm>
        freeze: False # Overall freeze for the HF model (will be overridden by specific layer freezing below)
        freeze_feature_extractor: !ref <wav2vec2_freeze_feature_extractor> 
        # freeze_encoder_layers: !ref <wav2vec2_freeze_encoder_layers> # This might not be a direct param here, handled in Brain
        save_path: !ref <output_folder>/wav2vec2_checkpoint # Path for SB to save internal HF model if needed
    
    ssl_head: !ref <ssl_prediction_head> # Reference the new prediction head

# Loss function for SSL (CrossEntropy for predicting cluster IDs)
# This will be instantiated/called in the Brain class's compute_objectives method.
# Conceptual placeholder for where the loss type would be decided:
# ssl_criterion_type: "cross_entropy" # e.g. to guide Brain to use NLLLoss or similar.

# The train_logger can be 'stdout', 'tensorboard', 'wandb', etc.
train_logger: stdout 
# wandb_logger_opts: # Optional, if using Weights & Biases
#    project_name: "runyoro_ssl"
